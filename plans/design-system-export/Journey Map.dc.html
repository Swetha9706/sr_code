<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Londrina Solid';src:url('uploads/LondrinaSolid-Regular.otf') format('opentype');font-weight:100 900;font-style:normal;font-display:swap}
body{margin:0;background:#FDFCEF;color:#30272A;font-family:'Bricolage Grotesque',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#30272A;text-decoration-color:#ED4175;text-decoration-thickness:2px;text-underline-offset:4px}
a:hover{color:#B8245A}
*{box-sizing:border-box}
</style>
</helmet>
<section data-screen-label="Journey Map" style="background:#FDFCEF;padding:clamp(32px,6vw,64px) clamp(20px,4vw,56px);">
<div style="max-width:1620px;margin:0 auto;display:flex;flex-direction:column;gap:36px;">

<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px 32px;flex-wrap:wrap;">
<div style="display:flex;flex-direction:column;gap:10px;">
<span style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#5E5254;">Case Study · Experience Map</span>
<h2 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(44px,5.5vw,68px);line-height:1;letter-spacing:-0.03em;">Journey <span style="color:#ED4175;">Map</span></h2>
</div>
<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#5E5254;">
<span style="display:flex;align-items:center;gap:8px;"><span style="width:14px;height:14px;border-radius:50%;background:#FF90D5;border:1px solid #30272A;"></span>Positive / momentum</span>
<span style="display:flex;align-items:center;gap:8px;"><span style="width:14px;height:14px;border-radius:50%;background:#AABFF8;border:1px solid #30272A;"></span>Tension / friction</span>
</div>
</div>

<div style="overflow-x:auto;margin:0 calc(-1 * clamp(20px,4vw,56px));padding:0 clamp(20px,4vw,56px) 8px;">
<div style="min-width:1180px;display:flex;flex-direction:column;gap:14px;">

<div style="display:grid;grid-template-columns:140px repeat(6,minmax(0,1fr));gap:14px;align-items:stretch;">
<div style="display:flex;align-items:center;font-family:'Londrina Solid',sans-serif;font-size:28px;line-height:1;">Stages</div>
<sc-for list="{{ stages }}" as="s" hint-placeholder-count="6">
<div style="min-height:96px;background:#FCF0F4;border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;">
<span style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#B8245A;">{{ s.num }}</span>
<span style="font-family:'Londrina Solid',sans-serif;font-size:26px;line-height:1;">{{ s.name }}</span>
</div>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:140px repeat(6,minmax(0,1fr));gap:14px;align-items:stretch;">
<div style="display:flex;align-items:center;font-family:'Londrina Solid',sans-serif;font-size:28px;line-height:1;">User goal</div>
<sc-for list="{{ goals }}" as="t" hint-placeholder-count="6">
<div style="border:1px solid #E7DECF;border-radius:14px;padding:14px;font-size:15px;font-weight:500;line-height:1.45;text-wrap:pretty;">{{ t }}</div>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:140px repeat(6,minmax(0,1fr));gap:14px;align-items:stretch;">
<div style="display:flex;align-items:center;font-family:'Londrina Solid',sans-serif;font-size:28px;line-height:1;">Touchpoints</div>
<sc-for list="{{ touch }}" as="t" hint-placeholder-count="6">
<div style="border:1px solid #E7DECF;border-radius:14px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;line-height:1.7;color:#5E5254;">{{ t }}</div>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:140px repeat(6,minmax(0,1fr));gap:14px;align-items:stretch;">
<div style="display:flex;align-items:center;font-family:'Londrina Solid',sans-serif;font-size:28px;line-height:1;">User action</div>
<sc-for list="{{ actions }}" as="a" hint-placeholder-count="6">
<div style="background:#FCF0F4;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;">
<sc-for list="{{ a }}" as="line" hint-placeholder-count="3">
<div style="display:flex;gap:8px;font-size:14px;line-height:1.45;"><span style="color:#ED4175;">•</span><span>{{ line }}</span></div>
</sc-for>
</div>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:140px repeat(6,minmax(0,1fr));gap:14px;align-items:stretch;">
<div style="display:flex;align-items:center;font-family:'Londrina Solid',sans-serif;font-size:28px;line-height:1;">Thinking</div>
<sc-for list="{{ thinking }}" as="t" hint-placeholder-count="6">
<div style="border:1px solid #E7DECF;border-radius:14px;padding:14px;font-size:16px;font-weight:500;line-height:1.4;letter-spacing:-0.01em;text-wrap:pretty;">{{ t }}</div>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:stretch;margin:8px 0;">
<div style="display:flex;align-items:center;font-family:'Londrina Solid',sans-serif;font-size:28px;line-height:1;">Emotional journey</div>
<div style="position:relative;height:300px;background:#FCF0F4;border-radius:20px;overflow:hidden;">
<div style="position:absolute;inset:0;background-image:linear-gradient(rgba(48,39,42,0.06) 1px,transparent 1px);background-size:100% 50px;"></div>
<svg viewBox="0 0 1200 300" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;display:block;">
<path d="M 100 245 C 180 245 220 195 300 195 C 380 195 430 225 500 225 C 580 225 590 150 660 150 C 760 150 810 125 900 125 C 1000 125 1010 70 1100 70" fill="none" stroke="#30272A" stroke-width="2" vector-effect="non-scaling-stroke"></path>
</svg>
<div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));">
<sc-for list="{{ emotions }}" as="e" hint-placeholder-count="6">
<div style="position:relative;">
<span style="position:absolute;left:50%;top:{{ e.y }};width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:{{ e.dot }};border:1px solid #30272A;"></span>
<div style="position:absolute;left:8px;right:8px;top:{{ e.tagTop }};display:flex;flex-direction:column;align-items:center;gap:6px;">
<sc-for list="{{ e.tags }}" as="g" hint-placeholder-count="3">
<span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;background:{{ g.bg }};color:#30272A;border:1px solid #30272A;border-radius:999px;padding:3px 10px;">{{ g.t }}</span>
</sc-for>
</div>
</div>
</sc-for>
</div>
</div>
</div>

<div style="display:grid;grid-template-columns:140px repeat(6,minmax(0,1fr));gap:14px;align-items:stretch;">
<div style="display:flex;align-items:center;font-family:'Londrina Solid',sans-serif;font-size:28px;line-height:1;">Pain points</div>
<sc-for list="{{ pains }}" as="t" hint-placeholder-count="6">
<div style="border:1px solid #E7DECF;border-radius:14px;padding:14px;font-size:14px;line-height:1.5;color:#5E5254;text-wrap:pretty;">{{ t }}</div>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:140px repeat(6,minmax(0,1fr));gap:14px;align-items:stretch;">
<div style="display:flex;align-items:center;font-family:'Londrina Solid',sans-serif;font-size:28px;line-height:1;">Opportunity</div>
<sc-for list="{{ opps }}" as="t" hint-placeholder-count="6">
<div style="background:#30272A;color:#FDFCEF;border-radius:14px;padding:14px;font-size:14px;line-height:1.5;text-wrap:pretty;">{{ t }}</div>
</sc-for>
</div>

</div>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const P = '#FF90D5', T = '#AABFF8';
    const tag = (t, pos) => ({ t, bg: pos ? P : T });
    // dot y (% of 300px) matches the SVG curve; tags sit above or below the dot
    return {
      stages: [
        { num: '01', name: 'Awareness' }, { num: '02', name: 'Consideration' }, { num: '03', name: 'Onboarding' },
        { num: '04', name: 'Guidance' }, { num: '05', name: 'Engagement' }, { num: '06', name: 'Fulfilment' }
      ],
      goals: [
        'Understand if they are on track and overhaul their finances',
        'Find a trustworthy tool and compare the options',
        'Picture their future lifestyle and what it will cost',
        'Turn the estimate into a realistic, personalized plan',
        'Stay motivated and keep saving consistently',
        'Retire comfortably into the life they planned for'
      ],
      touch: [
        'Search · pension letters · word of mouth',
        'App stores · review sites · competitor apps',
        'Onboarding · image quiz · profile card · estimate',
        'Advisor match · video call · recommendation doc',
        'Weekly horoscope · milestone cards · nudges · tracker',
        'Pension dashboard · annual review · milestone archive'
      ],
      actions: [
        ['Notices retirement anxiety', 'Seeks information', 'Starts a finance overhaul'],
        ['Researches new resources', 'Compares products', 'Signs up for FutureScope'],
        ['Completes the visual quiz', 'Reacts to the savings estimate', 'Receives a lifestyle profile'],
        ['Books & attends the advisor meeting', 'Receives a document of suggestions', 'Sets realistic targets'],
        ['Re-arranges weekly / monthly costs', 'Logs saved money', 'Reads the forecast & collects milestones'],
        ['Draws down the pension', 'Organizes the rest of their life', 'Reflects on the journey']
      ],
      thinking: [
        '“I know I should plan, but where do I even begin?”',
        '“They’re all just calculators — which one actually gets me?”',
        '“I can’t picture that far ahead, but this makes it feel real.”',
        '“Talking to someone made the number feel manageable.”',
        '“Checking in is something I look forward to now.”',
        '“I feel ready for a future I couldn’t picture before.”'
      ],
      emotions: [
        { y: '81.7%', dot: T, tagTop: '16%', tags: [tag('Overwhelmed', 0), tag('Anxious', 0), tag('Avoidant', 0)] },
        { y: '65%', dot: P, tagTop: '18%', tags: [tag('Curious', 1), tag('Skeptical', 0), tag('Hopeful', 1)] },
        { y: '75%', dot: T, tagTop: '24%', tags: [tag('Nervous', 0), tag('Surprised', 0), tag('Reassured', 1)] },
        { y: '50%', dot: P, tagTop: '60%', tags: [tag('Understood', 1), tag('Supported', 1), tag('Confident', 1)] },
        { y: '41.7%', dot: P, tagTop: '52%', tags: [tag('Motivated', 1), tag('Engaged', 1), tag('Distracted', 0)] },
        { y: '23.3%', dot: P, tagTop: '36%', tags: [tag('Fulfilled', 1), tag('Free', 1), tag('Proud', 1)] }
      ],
      pains: [
        'No idea where to start; retirement feels abstract and distant.',
        'Jargon-heavy, number-first tools; hard to trust; decision paralysis.',
        'A large savings figure can trigger anxiety and fear of being “behind”.',
        'Fears the advice will be generic; unsure the goal is achievable.',
        'Motivation fades; check-ins feel like a chore; life events disrupt the plan.',
        'Will the money truly last? Adjusting to life on a fixed income.'
      ],
      opps: [
        'Meet users with reflection, not calculation — jargon-free pension education.',
        'Lead with a relatable, personality-led entry that earns trust before numbers.',
        'Make the future imaginable with the image quiz and a grounded, real estimate.',
        'Pair every user with a human advisor who turns the profile into a concrete plan.',
        'Reframe progress as a horoscope and milestone cards so check-ins feel rewarding.',
        'Celebrate arrival; show gains as “weeks of retirement funded”.'
      ]
    };
  }
}
</script>
</body>
</html>
